name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile Python
        run: python -m compileall custom_components

  package-alpha6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create ready-to-use integration ZIP
        run: zip -r aquagem_isaver-v0.4.0-alpha.6.zip custom_components/aquagem_isaver
      - name: Upload integration ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aquagem-isaver-alpha6
          path: aquagem_isaver-v0.4.0-alpha.6.zip
          retention-days: 1
